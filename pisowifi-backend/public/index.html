<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piso WiFi Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-900">Piso WiFi Dashboard</h1>
      <button onclick="loadDashboardData()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium transition">
        Refresh Data
      </button>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
        <p class="text-sm font-medium text-gray-500">Total Sales Today</p>
        <p id="totalSales" class="text-3xl font-bold text-gray-900 mt-2">₱0.00</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
        <p class="text-sm font-medium text-gray-500">Active Vouchers</p>
        <p id="activeVouchers" class="text-3xl font-bold text-gray-900 mt-2">0</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
        <p class="text-sm font-medium text-gray-500">Total Vouchers Issued</p>
        <p id="totalVouchers" class="text-3xl font-bold text-gray-900 mt-2">0</p>
      </div>
    </div>

    <!-- Chart & Table Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- Sales Chart -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Sales Overview</h2>
        <div class="h-64">
          <canvas id="salesChart"></canvas>
        </div>
      </div>

      <!-- Recent Vouchers Table -->
      <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
        <h2 class="text-xl font-semibold mb-4">Recent Vouchers</h2>
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-sm font-medium text-gray-500">
              <th class="py-2">Code</th>
              <th class="py-2">Amount</th>
              <th class="py-2">Duration</th>
              <th class="py-2">Status</th>
              <th class="py-2">Created</th>
            </tr>
          </thead>
          <tbody id="vouchersTable" class="divide-y text-sm text-gray-700">
            <!-- Data dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:4000/api';
    let salesChartInstance = null;

    async function loadDashboardData() {
      try {
        // 1. Fetch Vouchers List
        const res = await fetch(`${API_BASE}/vouchers`);
        const vouchers = await res.json();

        // Calculate Totals
        const totalCount = vouchers.length;
        const activeCount = vouchers.filter(v => v.status === 'active').length;
        const totalPesos = vouchers.reduce((sum, v) => sum + (v.pesos || 0), 0);

        document.getElementById('totalVouchers').textContent = totalCount;
        document.getElementById('activeVouchers').textContent = activeCount;
        document.getElementById('totalSales').textContent = `₱${totalPesos.toFixed(2)}`;

        // Populate Table (Most recent 10)
        const tableBody = document.getElementById('vouchersTable');
        tableBody.innerHTML = vouchers.slice(0, 10).map(v => `
          <tr>
            <td class="py-2 font-mono font-bold text-blue-600">${v.code}</td>
            <td class="py-2">₱${v.pesos}</td>
            <td class="py-2">${v.minutes}m</td>
            <td class="py-2">
              <span class="px-2 py-1 text-xs rounded font-semibold ${v.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}">
                ${v.status}
              </span>
            </td>
            <td class="py-2 text-xs text-gray-500">${new Date(v.createdAt).toLocaleTimeString()}</td>
          </tr>
        `).join('');

        // 2. Fetch Sales Chart Data
        const chartRes = await fetch(`${API_BASE}/sales`);
        if (chartRes.ok) {
          const chartData = await chartRes.json();
          renderChart(chartData);
        }
      } catch (err) {
        console.error('Failed to load dashboard data:', err);
      }
    }

    function renderChart(data) {
      const ctx = document.getElementById('salesChart').getContext('2d');
      if (salesChartInstance) salesChartInstance.destroy();

      salesChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels || [],
          datasets: [{
            label: 'Earnings (₱)',
            data: data.values || [],
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Initial Load
    loadDashboardData();
  </script>
</body>
</html>
